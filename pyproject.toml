[project]
name = "bank-marketing-mlops"
version = "0.1.0"
description = "Reproducible Bank Marketing classification experiment"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2,<3", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "joblib>=1.4,<2", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ipykernel>=6,<8", "ruff>=0.11,<1", "pre-commit>=4,<5", "nbclient>=0.10,<1", "nbformat>=5,<6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

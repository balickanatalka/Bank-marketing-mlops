repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check (uv.lock)
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi, jupyter]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check (uv.lock)
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format (uv.lock)
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi, jupyter]
